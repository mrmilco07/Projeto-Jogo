<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fase 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="gameplay.css">
</head>
<body data-phase="3">
<main>
<div id="hud"><div class="box" id="hs">FASE 3/3</div><div class="box" id="hk">CHAVES 0/5</div><div class="box" id="ht">TEMPO 20</div></div>
<div id="wrap">
<canvas id="c" width="480" height="320"></canvas>
</div>
<div id="controls" role="group" aria-label="Controles direcionais">
<button type="button" data-dir="up" aria-label="Mover para cima">▲</button>
<button type="button" data-dir="left" aria-label="Mover para a esquerda">◀</button>
<button type="button" data-dir="down" aria-label="Mover para baixo">▼</button>
<button type="button" data-dir="right" aria-label="Mover para a direita">▶</button>
</div>
</main>
<script>const T=32,REQUIRED_KEYS=[4,4,5],TOTAL=20;
const PHASE=Math.max(1,Math.min(3,Number(document.body.dataset.phase)||1));
const MAPS=[[
"###############",
"#P.....#......#",
"#..2...#...5..#",
"#.1....#......#",
"#..##..#..##..#",
"#..##......##.D",
"#......#......#",
"#.3....#......#",
"#......#......#",
"###############"],[
"###############",
"#.....#....6..#",
"#.4...#.......#",
"#.....#..###..#",
"#.##.....#1...#",
"P.##..#..#....D",
"#.....#.......#",
"#...2.#..###..#",
"#.....#.......#",
"###############"],[
"###############",
"#1..#...#.2...#",
"#...#.......#.#",
"#...#...#.....#",
"#.............#",
"P.............D",
"#...#.......#.#",
"#.3.#...#.4.#.#",
"#...#...#...5.#",
"###############"]];
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;

/* ---------- sprites 8x8 (estilo 16-bit) ---------- */
function mk(rows,pal){const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<8;i++){const p=pal[r[i]];if(p){x.fillStyle=p;x.fillRect(i,j,1,1)}}});return c}
const ed=(rows,pts)=>{const a=rows.map(r=>r.split(''));pts.forEach(([r,c,ch])=>a[r][c]=ch);return a.map(r=>r.join(''))};
const WALL=["mmmmmmmm","allaaaam","aaaaaaam","aaaaaaam","mmmmmmmm","aaamalla","aaamaaaa","aaamaaaa"];
const WP={a:'#454a5c',m:'#262935',l:'#5c6278',k:'#0a0a12',u:'#9aa0b0',n:'#4a6aa8'};
const winPts=[];for(let r=1;r<=6;r++)for(let c=2;c<=5;c++)winPts.push([r,c,(c===2||c===4)?'u':'k']);winPts.push([1,3,'n'],[1,5,'n']);
const FL=["gggggggd","gffffffd","gffffffd","gfffgffd","gffffffd","gffffffd","gffffffd","dddddddd"];
function doorRows(open){const a=[];for(let r=0;r<8;r++){let s='';for(let c=0;c<8;c++){let ch;
  if(r===0||c===0||c===7)ch='d';else if(open)ch='L';else ch=(c===3)?'d':(r===2||r===5)?'i':'o';s+=ch}a.push(s)}return a}
const DP={d:'#2a1608',o:'#7a4a22',i:'#9aa0b0',y:'#f8d838',L:'#fff6b0'};
const HP={h:'#7a3e1a',s:'#f2bf94',k:'#14141f',b:'#3a6fe0',w:'#f8f8ff',l:'#4a2810'};
const HA=["..hhhh..",".hhhhhh.",".ssksks.",".ssssss.",".bbbbbb.","sbbwwbbs",".bb..bb.",".ll..ll."];
const GP={w:'#e8ecff',r:'#ff3030',d:'#4a4a66'};
const GA=["..wwww..",".wwwwww.","wwrwwrww","wwwwwwww","wwwddwww","wwwwwwww","wwwwwwww","w.ww.ww."];
const SP={
  wall:mk(WALL,WP),win:mk(ed(WALL,winPts),WP),
  floorA:mk(FL,{f:'#5d6272',g:'#6c7285',d:'#434756'}),floorB:mk(FL,{f:'#565b6a',g:'#656b7d',d:'#3d414f'}),
  doorC:mk(ed(doorRows(false),[[3,3,'i'],[3,4,'i'],[4,3,'y'],[4,4,'y']]),DP),doorO:mk(doorRows(true),DP),
  key:mk(["..yyyy..",".yyooyy.",".yy..yy.",".yyooyy.","..yyyy..","...yy...","...yyy..","...yy.y."],{y:'#f8d838',o:'#b8861c'}),
  hA:mk(HA,HP),hB:mk(HA.slice(0,6).concat(["..bbbb..","..l..l.."]),HP),
  gA:mk(GA,GP),gB:mk(ed(GA,[[7,0,'.'],[7,1,'w'],[7,2,'w'],[7,3,'.'],[7,4,'w'],[7,5,'w'],[7,6,'.'],[7,7,'w']]),GP)
};

/* ---------- som (bips estilo 16-bit) ---------- */
let AC;function beep(f,d,t,v,w){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),n=AC.createGain(),s=AC.currentTime+(w||0);
  o.type=t||'square';o.frequency.value=f;n.gain.setValueAtTime(v||.05,s);n.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(n);n.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}

/* ---------- estado ---------- */
let S={mode:'menu',i:0,sum:0,wf:0,face:1},held=[];
function load(i){
  S.i=i;S.keys=0;S.grid=MAPS[i].map(r=>r.split(''));
  for(let y=0;y<10;y++)for(let x=0;x<15;x++)if(S.grid[y][x]==='P'){S.px=x;S.py=y;S.grid[y][x]='.'}
  S.ghosts=[{x:13,y:1},{x:13,y:8}];
  S.eg=performance.now()+1000;
}
function start(){S.mode='play';S.wf=0;S.face=1;load(PHASE-1);S.t0=performance.now();hud();beep(523,.1);beep(784,.15,'square',.05,.1)}
function hud(){
  $('hs').textContent='FASE '+PHASE+'/3';
  $('hk').textContent='CHAVES '+S.keys+'/'+REQUIRED_KEYS[S.i];
  const r=Math.max(0,TOTAL-(performance.now()-S.t0)/1000);
  $('ht').textContent='TEMPO '+Math.ceil(r);$('ht').classList.toggle('low',r<10);
}
function over(){S.mode='over';location.href='gameover.html'}
function caught(){beep(220,.25,'sawtooth');beep(147,.4,'sawtooth',.05,.2);over()}
function estep(){
  if(S.mode!=='play'||performance.now()<S.eg)return;
  const k=(x,y)=>y*15+x;
  for(const ghost of S.ghosts){
    const q=[[ghost.x,ghost.y]],prev={};prev[k(ghost.x,ghost.y)]=null;
    let found=false;
    for(let h=0;h<q.length&&!found;h++){
      const [x,y]=q[h];
      for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>14||ny>9)continue;
        const c=S.grid[ny][nx],occupied=S.ghosts.some(other=>other!==ghost&&other.x===nx&&other.y===ny);
        if(c==='#'||c==='D'||(occupied&&(nx!==S.px||ny!==S.py))||(k(nx,ny) in prev))continue;
        prev[k(nx,ny)]=[x,y];q.push([nx,ny]);
        if(nx===S.px&&ny===S.py){found=true;break}
      }
    }
    if(!found)continue;
    let cur=[S.px,S.py],p=prev[k(cur[0],cur[1])];
    while(p&&prev[k(p[0],p[1])]){cur=p;p=prev[k(p[0],p[1])]}
    ghost.x=cur[0];ghost.y=cur[1];
    if(ghost.x===S.px&&ghost.y===S.py){caught();return}
  }
}
function step(){
  if(S.mode!=='play'||!held.length)return;
  const [dx,dy]=held[held.length-1],nx=S.px+dx,ny=S.py+dy;
  if(dx)S.face=dx;
  if(nx<0||ny<0||nx>14||ny>9)return;
  const c=S.grid[ny][nx];
  if(c==='#')return;
  if(c==='D'){
    if(S.keys<REQUIRED_KEYS[S.i]){beep(150,.15,'square');return}
    if(PHASE<3){location.href='gameplay'+(PHASE+1)+'.html';return}
    if(S.keys>=REQUIRED_KEYS[S.i]){
      [523,659,784,1047].forEach((f,i)=>beep(f,.18,'square',.05,i*.12));
      S.mode='win';location.href='victory.html';return}
    beep(150,.15,'square');return;
  }
  S.px=nx;S.py=ny;S.wf++;
  if(S.ghosts.some(ghost=>S.px===ghost.x&&S.py===ghost.y)){caught();return}
  if(c>='1'&&c<='9'){S.keys++;S.grid[ny][nx]='.';beep(988,.08);beep(1318,.12,'square',.05,.08)}
  hud();
}

/* ---------- desenho ---------- */
function spr(c,x,y,flip){if(flip){g.save();g.translate(x+T,y);g.scale(-1,1);g.drawImage(c,0,0,T,T);g.restore()}else g.drawImage(c,x,y,T,T)}
function draw(){
  g.imageSmoothingEnabled=false;
  const now=performance.now(),fl=(now/260|0)%2;
  g.fillStyle='#0a0a12';g.fillRect(0,0,480,320);
  if(!S.grid)return;
  for(let y=0;y<10;y++)for(let x=0;x<15;x++){
    const c=S.grid[y][x],px=x*T,py=y*T,edge=x===0||x===14||y===0||y===9,m=(x+y*2)%4;
    if(c==='#'){
      let s=SP.wall;
      if(edge&&m===1)s=SP.win;
      g.drawImage(s,px,py,T,T);
    }else if(c==='D'){
      g.drawImage(S.keys>=REQUIRED_KEYS[S.i]?SP.doorO:SP.doorC,px,py,T,T);
    }else{
      g.drawImage((x+y)%2?SP.floorA:SP.floorB,px,py,T,T);
      if(c>='1'&&c<='9'){
        g.drawImage(SP.key,px+1,py+1,24,24);
      }
    }
  }
  const gy=Math.sin(now/220)*3;
  g.globalAlpha=.92;
  S.ghosts.forEach(ghost=>spr(fl?SP.gB:SP.gA,ghost.x*T,ghost.y*T-4+gy,S.px<ghost.x));
  g.globalAlpha=1;
  spr(S.wf%2?SP.hB:SP.hA,S.px*T,S.py*T-2,S.face<0);
}
function tick(){
  if(S.mode==='play'){
    hud();
    if(performance.now()-S.t0>=TOTAL*1000){beep(220,.25,'sawtooth');beep(147,.4,'sawtooth',.05,.2);over()}
  }
  draw();requestAnimationFrame(tick);
}

/* ---------- controles ---------- */
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
const sameD=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function press(d){held=held.filter(h=>!sameD(h,d));held.push(d);step()}
function release(d){held=held.filter(h=>!sameD(h,d))}
addEventListener('keydown',e=>{const d=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(d){e.preventDefault();if(!e.repeat)press(d)}});
addEventListener('keyup',e=>{const d=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(d)release(d)});
const DIRECTIONS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll('#controls button').forEach(button=>{
  const direction=DIRECTIONS[button.dataset.dir];
  button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);press(direction)});
  const stop=e=>{if(button.hasPointerCapture(e.pointerId))button.releasePointerCapture(e.pointerId);release(direction)};
  button.addEventListener('pointerup',stop);
  button.addEventListener('pointercancel',stop);
  button.addEventListener('lostpointercapture',e=>release(direction));
});
setInterval(estep,380);
start();
requestAnimationFrame(tick);
</script>
</body>
</html>
